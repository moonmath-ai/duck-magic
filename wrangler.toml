# Change this to your own unique Worker name before deploying.
name = "duck-magic-remix"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ZRO_MODEL = "glm-5.3-flash"
ZRO_BASE_URL = "https://zro.moonmath.ai/v1"
DUEL_GLOBAL_BUDGET_USD = "2.00"
DUEL_QWEN_BUDGET_USD = "3.00"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[durable_objects.bindings]]
name = "DUEL_STATE"
class_name = "DuelState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DuelState"]
